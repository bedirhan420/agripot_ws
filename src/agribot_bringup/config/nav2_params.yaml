# Nav2 parametreleri (kisaltilmis iskelet).
# Bu proje icin Nav2'nin rolu SINIRLIDIR: yalnizca dinamik engel
# (traktor/isci/hayvan) kacinma icin costmap + local planner kullanilir;
# birincil "sira ici merkezleme" RowFollowingStrategy'nindir (custom,
# RGB-D point cloud tabanli). Bu nedenle global_costmap kucuk tutulmus,
# local_costmap'in obstacle/inflation katmanlari one cikarilmistir.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      max_angular_accel: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      width: 4
      height: 4
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.1
      plugins: ["static_layer", "inflation_layer"]
