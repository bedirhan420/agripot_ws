# robot_localization ekf_node konfigurasyonu.
# Camurlu zeminde tekerlek kaymasina karsi wheel_odom'a daha DUSUK,
# imu0'a daha YUKSEK guven verilecek sekilde ayarlanmistir.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, true,
                    false, false, false]
    # Tekerlek kaymasi (camur) supheli oldugundan dogrusal hiza dusuk agirlik:
    odom0_queue_size: 10
    odom0_differential: false

    imu0: /imu
    imu0_config: [false, false, false,
                   false, false, true,
                   false, false, false,
                   true,  true,  true,
                   true,  false, false]
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # GPS ayri bir navsat_transform_node ile entegre edilir (proje dokumaninda
    # belirtildigi gibi GPS her zaman guvenilir degildir; agac orti altinda
    # kalite dususu beklenir -- bu yuzden GPS burada BIRINCIL kaynak degildir).
    process_noise_covariance: [0.05, 0,    0,    0,    0,    0,
                                0,    0.05, 0,    0,    0,    0,
                                0,    0,    0.06, 0,    0,    0,
                                0,    0,    0,    0.03, 0,    0,
                                0,    0,    0,    0,    0.03, 0,
                                0,    0,    0,    0,    0,    0.06]
